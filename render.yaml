# render.yaml — Render Blueprint (Infrastructure as Code)
# This file auto-configures your services when you connect the repo to Render.
# Docs: https://docs.render.com/blueprint-spec

services:
  # ─── Backend API ───────────────────────────────────────
  - type: web
    name: mini-mart-api
    runtime: node
    region: singapore  # Change to your closest region
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true  # Render auto-generates a secure random value
      - key: JWT_EXPIRE
        value: 7d
      - key: MONGODB_URI
        sync: false  # You'll set this manually after creating your Atlas cluster
      - key: FRONTEND_URL
        sync: false  # Set to your frontend URL after it deploys, e.g. https://mini-mart-frontend.onrender.com
